<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="PubSub fan out: the board server broadcasts each applied op on the board topic and every subscribed BoardLive pushes it, the sender's included; a cursor goes from one BoardLive with broadcast_from to every other BoardLive, never back to the sender; the browser throttles cursor sends to one per 50 ms">
  <style>
    :root { --bg: #ffffff; --ink: #1f2430; --muted: #5c6370; --client: #ebfbee; --clientedge: #2f9e44; --server: #e8eefc; --serveredge: #3b5bdb; --topic: #fff4e6; --topicedge: #f08c00; --arrow: #5c6370; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1b1e27; --ink: #e6e9f2; --muted: #a3aab8; --client: #1f3326; --clientedge: #69db7c; --server: #26304d; --serveredge: #8aa4ff; --topic: #3a2a14; --topicedge: #ffc078; --arrow: #a3aab8; }
    }
    .bg { fill: var(--bg); }
    .client { fill: var(--client); stroke: var(--clientedge); stroke-width: 2; }
    .server { fill: var(--server); stroke: var(--serveredge); stroke-width: 2; }
    .topic { fill: var(--topic); stroke: var(--topicedge); stroke-width: 2; }
    .edge { fill: none; stroke: var(--arrow); stroke-width: 2; marker-end: url(#fan-tip); }
    .tip { fill: var(--arrow); }
    text { fill: var(--ink); font-family: system-ui, sans-serif; font-size: 15px; }
    .small { font-size: 13px; fill: var(--muted); }
    .head { font-weight: 600; }
  </style>
  <defs>
    <marker id="fan-tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="tip"/></marker>
  </defs>
  <rect class="bg" width="640" height="380"/>

  <text x="20" y="30" class="head">One topic per board, every viewer subscribed</text>

  <rect class="server" x="20" y="60" width="170" height="60" rx="8"/>
  <text x="105" y="86" text-anchor="middle">BoardServer</text>
  <text x="105" y="106" text-anchor="middle" class="small">broadcast_op/2</text>

  <rect class="topic" x="235" y="60" width="170" height="60" rx="8"/>
  <text x="320" y="86" text-anchor="middle">"board:slug"</text>
  <text x="320" y="106" text-anchor="middle" class="small">Phoenix.PubSub</text>

  <path class="edge" d="M190,90 L233,90"/>

  <rect class="server" x="450" y="50" width="170" height="54" rx="8"/>
  <text x="535" y="75" text-anchor="middle">BoardLive, Ada</text>
  <text x="535" y="94" text-anchor="middle" class="small">sent the op, gets it too</text>

  <rect class="server" x="450" y="130" width="170" height="54" rx="8"/>
  <text x="535" y="155" text-anchor="middle">BoardLive, Lin</text>
  <text x="535" y="174" text-anchor="middle" class="small">push_event shape:added</text>

  <path class="edge" d="M405,80 L448,77"/>
  <path class="edge" d="M405,100 L448,150"/>

  <text x="20" y="226" class="head">Cursors skip the board server</text>

  <rect class="client" x="20" y="250" width="170" height="60" rx="8"/>
  <text x="105" y="276" text-anchor="middle">Ada's browser</text>
  <text x="105" y="296" text-anchor="middle" class="small">throttle: one per 50 ms</text>

  <rect class="server" x="235" y="250" width="170" height="60" rx="8"/>
  <text x="320" y="276" text-anchor="middle">BoardLive, Ada</text>
  <text x="320" y="296" text-anchor="middle" class="small">broadcast_from self()</text>

  <rect class="server" x="450" y="250" width="170" height="60" rx="8"/>
  <text x="535" y="276" text-anchor="middle">BoardLive, Lin</text>
  <text x="535" y="296" text-anchor="middle" class="small">push cursor:moved</text>

  <path class="edge" d="M190,280 L233,280"/>
  <path class="edge" d="M405,280 L448,280"/>
  <text x="212" y="330" text-anchor="middle" class="small">cursor:move</text>
  <text x="427" y="330" text-anchor="middle" class="small">{:cursor, cursor}</text>

  <text x="20" y="362" class="small">Subscribe before the snapshot: an op in between arrives twice, never zero times.</text>
</svg>
