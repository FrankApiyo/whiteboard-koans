<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Easel's tests at three heights: many pure tests of functions over plain data; component and LiveView tests with Vitest and Testing Library and with LiveViewTest, using renderBoard, open_board and add_shape; and a few Playwright tests running the solved app with two browsers">
  <style>
    :root { --bg: #ffffff; --ink: #1f2430; --muted: #5c6370; --client: #ebfbee; --clientedge: #2f9e44; --server: #e8eefc; --serveredge: #3b5bdb; --topic: #fff4e6; --topicedge: #f08c00; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1b1e27; --ink: #e6e9f2; --muted: #a3aab8; --client: #1f3326; --clientedge: #69db7c; --server: #26304d; --serveredge: #8aa4ff; --topic: #3a2a14; --topicedge: #ffc078; }
    }
    .bg { fill: var(--bg); }
    .client { fill: var(--client); stroke: var(--clientedge); stroke-width: 2; }
    .server { fill: var(--server); stroke: var(--serveredge); stroke-width: 2; }
    .topic { fill: var(--topic); stroke: var(--topicedge); stroke-width: 2; }
    text { fill: var(--ink); font-family: system-ui, sans-serif; font-size: 15px; }
    .small { font-size: 13px; fill: var(--muted); }
    .head { font-weight: 600; }
  </style>
  <rect class="bg" width="640" height="360"/>

  <text x="20" y="30" class="head">Tests at three heights</text>

  <rect class="topic" x="220" y="50" width="200" height="60" rx="8"/>
  <text x="320" y="76" text-anchor="middle">Playwright, a few tests</text>
  <text x="320" y="96" text-anchor="middle" class="small">solved app, two browsers</text>

  <rect class="client" x="120" y="130" width="190" height="80" rx="8"/>
  <text x="215" y="156" text-anchor="middle">Vitest components</text>
  <text x="215" y="176" text-anchor="middle" class="small">jsdom, a fake live</text>
  <text x="215" y="196" text-anchor="middle" class="small">renderBoard</text>

  <rect class="server" x="330" y="130" width="190" height="80" rx="8"/>
  <text x="425" y="156" text-anchor="middle">ExUnit LiveViews</text>
  <text x="425" y="176" text-anchor="middle" class="small">no browser, render_hook</text>
  <text x="425" y="196" text-anchor="middle" class="small">open_board, add_shape</text>

  <rect class="client" x="20" y="230" width="290" height="70" rx="8"/>
  <text x="165" y="256" text-anchor="middle">pure TypeScript</text>
  <text x="165" y="278" text-anchor="middle" class="small">geometry, guards, tools, throttle</text>

  <rect class="server" x="330" y="230" width="290" height="70" rx="8"/>
  <text x="475" y="256" text-anchor="middle">board server, Ops, Shapes</text>
  <text x="475" y="278" text-anchor="middle" class="small">no LiveView; :sys.get_state as a barrier</text>

  <text x="20" y="334" class="small">Lower down: more tests, each about one piece. Higher up: fewer, slower, the whole app.</text>
</svg>
