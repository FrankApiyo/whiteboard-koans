<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="The board server: a caller looks a board up by slug in the Registry and calls its pid directly; ensure_started starts it under the BoardSupervisor; the server keeps the shapes in memory, saves after a window, stops when idle, and saves in terminate">
  <style>
    :root { --bg: #ffffff; --ink: #1f2430; --muted: #5c6370; --server: #e8eefc; --serveredge: #3b5bdb; --store: #fff4e6; --storeedge: #e8590c; --arrow: #5c6370; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1b1e27; --ink: #e6e9f2; --muted: #a3aab8; --server: #26304d; --serveredge: #8aa4ff; --store: #3a2a1c; --storeedge: #ffa94d; --arrow: #a3aab8; }
    }
    .bg { fill: var(--bg); }
    .server { fill: var(--server); stroke: var(--serveredge); stroke-width: 2; }
    .store { fill: var(--store); stroke: var(--storeedge); stroke-width: 2; }
    .edge { fill: none; stroke: var(--arrow); stroke-width: 2; marker-end: url(#a); }
    .tip { fill: var(--arrow); }
    text { fill: var(--ink); font-family: system-ui, sans-serif; font-size: 15px; }
    .small { font-size: 13px; fill: var(--muted); }
    .head { font-weight: 600; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="tip"/></marker>
  </defs>
  <rect class="bg" width="640" height="400"/>

  <text x="20" y="28" class="head">One process per board</text>

  <rect class="server" x="20" y="50" width="170" height="60" rx="8"/>
  <text x="105" y="76" text-anchor="middle">a caller</text>
  <text x="105" y="96" text-anchor="middle" class="small">BoardLive, a koan</text>

  <rect class="server" x="450" y="50" width="170" height="60" rx="8"/>
  <text x="535" y="76" text-anchor="middle">BoardSupervisor</text>
  <text x="535" y="96" text-anchor="middle" class="small">100 restarts in 5 s</text>

  <rect class="server" x="20" y="180" width="170" height="60" rx="8"/>
  <text x="105" y="206" text-anchor="middle">Registry</text>
  <text x="105" y="226" text-anchor="middle" class="small">slug to pid</text>

  <rect class="server" x="300" y="170" width="320" height="110" rx="8"/>
  <text x="460" y="196" text-anchor="middle">BoardServer "plan"</text>
  <text x="460" y="218" text-anchor="middle" class="small">shapes by id, next_z, dirty?</text>
  <text x="460" y="240" text-anchor="middle" class="small">:save after save_after ms</text>
  <text x="460" y="262" text-anchor="middle" class="small">{:idle, ref}: stop :normal</text>

  <rect class="store" x="300" y="330" width="320" height="50" rx="8"/>
  <text x="460" y="360" text-anchor="middle">SQLite: load_shapes, save_shapes</text>

  <path class="edge" d="M190,80 L448,80"/>
  <text x="319" y="70" text-anchor="middle" class="small">ensure_started(slug)</text>

  <path class="edge" d="M535,110 L535,168"/>
  <text x="545" y="144" class="small">start_child</text>

  <path class="edge" d="M105,110 L105,178"/>
  <text x="95" y="144" text-anchor="end" class="small">lookup(slug)</text>

  <path class="edge" d="M190,100 L330,168"/>
  <text x="268" y="122" class="small">call(pid)</text>

  <path class="edge" d="M380,328 L380,282"/>
  <text x="372" y="310" text-anchor="end" class="small">init/1 loads</text>

  <path class="edge" d="M480,280 L480,328"/>
  <text x="490" y="310" class="small">:save, terminate/2</text>
</svg>
