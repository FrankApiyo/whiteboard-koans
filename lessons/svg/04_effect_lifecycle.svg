<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" role="img" aria-label="An effect runs after mount, runs its cleanup then runs again when state it read changes, and runs its cleanup when the component is destroyed">
  <style>
    :root { --bg: #ffffff; --ink: #1f2430; --muted: #5c6370; --run: #e8eefc; --runedge: #3b5bdb; --clean: #fff0d6; --cleanedge: #d9822b; --axis: #8a919e; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1b1e27; --ink: #e6e9f2; --muted: #a3aab8; --run: #26304d; --runedge: #8aa4ff; --clean: #4a3820; --cleanedge: #f0a860; --axis: #6b7280; }
    }
    .bg { fill: var(--bg); }
    .axis { stroke: var(--axis); stroke-width: 2; marker-end: url(#a); }
    .tick { stroke: var(--axis); stroke-width: 2; }
    .run { fill: var(--run); stroke: var(--runedge); stroke-width: 2; }
    .clean { fill: var(--clean); stroke: var(--cleanedge); stroke-width: 2; }
    .tip { fill: var(--axis); }
    text { fill: var(--ink); font-family: system-ui, sans-serif; font-size: 15px; }
    .small { font-size: 13px; fill: var(--muted); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="tip"/></marker>
  </defs>
  <rect class="bg" width="640" height="250"/>

  <text x="20" y="28">$effect: run, clean up, run again</text>

  <line class="axis" x1="20" y1="150" x2="620" y2="150"/>

  <line class="tick" x1="40" y1="142" x2="40" y2="158"/>
  <text x="40" y="180" text-anchor="middle" class="small">mount</text>

  <rect class="run" x="52" y="84" width="150" height="44" rx="6"/>
  <text x="127" y="104" text-anchor="middle">run</text>
  <text x="127" y="121" text-anchor="middle" class="small">reads x, starts work</text>

  <line class="tick" x1="236" y1="142" x2="236" y2="158"/>
  <text x="236" y="180" text-anchor="middle" class="small">x changes</text>

  <rect class="clean" x="252" y="84" width="96" height="44" rx="6"/>
  <text x="300" y="104" text-anchor="middle">cleanup</text>
  <text x="300" y="121" text-anchor="middle" class="small">stops it</text>

  <rect class="run" x="356" y="84" width="96" height="44" rx="6"/>
  <text x="404" y="104" text-anchor="middle">run</text>
  <text x="404" y="121" text-anchor="middle" class="small">reads x again</text>

  <line class="tick" x1="490" y1="142" x2="490" y2="158"/>
  <text x="490" y="180" text-anchor="middle" class="small">destroy</text>

  <rect class="clean" x="506" y="84" width="96" height="44" rx="6"/>
  <text x="554" y="104" text-anchor="middle">cleanup</text>
  <text x="554" y="121" text-anchor="middle" class="small">stops it</text>

  <text x="20" y="214" class="small">Only reads made while the effect runs are tracked: a change to y, read later</text>
  <text x="20" y="232" class="small">in a timer, starts no new run. The cleanup is the function the effect returns.</text>
</svg>
