name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          elixir-version: "1.19"
          otp-version: "28"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-test-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-test-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-

      # package.json installs live_svelte and phoenix from deps/, so Hex goes first.
      - run: mix deps.get
      - run: npm ci
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      # The layout reads the Vite manifest, so the tests need built assets.
      - run: mix assets.build
      - run: mix test
      - run: npm test
      - run: npx svelte-check --tsconfig assets/tsconfig.json --fail-on-warnings
      - run: npx tsc -p e2e

  e2e:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: e2e
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          elixir-version: "1.19"
          otp-version: "28"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-e2e-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-e2e-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-

      - run: mix deps.get
      - run: npm ci
      # Compiling here keeps the build out of Playwright's server start timeout.
      - run: mix compile
      - run: npx playwright install --with-deps chromium
      # Playwright starts the app with MIX_ENV=e2e on port 4100 (config/e2e.exs).
      - run: npm run e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
